<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Escape</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { overflow: hidden; height: 100%; background: #0a0a0c; font-family: system-ui, sans-serif; }
      #ui {
        position: fixed; inset: 0; pointer-events: none;
        color: #e8e6e3; text-shadow: 0 1px 8px #000;
      }
      #hud { position: absolute; left: 1rem; top: 1rem; font-size: 0.9rem; line-height: 1.5; max-width: 22rem; }
      #countdown {
        position: absolute; left: 50%; top: 28%; transform: translate(-50%, -50%);
        font-size: 4.5rem; font-weight: 800; letter-spacing: 0.05em; opacity: 0;
        transition: opacity 0.2s;
      }
      #countdown.show { opacity: 1; }
      #prompt {
        position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%);
        font-size: 1rem; opacity: 0.85;
      }
      #clickToPlay {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.45); color: #fff; font-size: 1.1rem; pointer-events: none;
        opacity: 1; transition: opacity 0.35s;
      }
      #clickToPlay.hidden { opacity: 0; pointer-events: none; }
      #end {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.72); font-size: 1.75rem; font-weight: 600; opacity: 0; pointer-events: none;
        transition: opacity 0.4s;
      }
      #end.visible { opacity: 1; pointer-events: auto; }
    </style>
    <script type="module" crossorigin src="/assets/index-Dr7aj91V.js"></script>
  </head>
  <body>
    <div id="ui">
      <div id="clickToPlay">Click the game to look around (mouse)</div>
      <div id="hud"></div>
      <div id="countdown"></div>
      <div id="prompt"></div>
      <div id="end"></div>
    </div>
  </body>
</html>
